<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emil Hodzic-Santor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --select: #000080; /* classic Windows selection navy */
      --select-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e0e;
        --fg: #f2f2f2;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8vh 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(2rem, 9vw, 8rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin: 0 0 9vh;
      max-width: 100%;
      overflow-wrap: break-word;
      text-wrap: balance;
    }

    .desktop {
      display: grid;
      grid-template-columns: repeat(4, auto);
      justify-content: center;
      gap: 24px 16px;
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: 100%;
    }

    @media (max-width: 600px) {
      .desktop { grid-template-columns: repeat(2, auto); }
    }

    .icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 120px;
      text-decoration: none;
      color: var(--fg);
      outline: none;
      cursor: default;
    }
    .icon svg {
      width: 64px;
      height: 52px;
      margin-bottom: 8px;
      shape-rendering: crispEdges;
    }
    .icon span {
      font-family: Tahoma, Verdana, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.2;
      max-width: 100%;
      overflow-wrap: break-word;
      padding: 1px 4px;
      border: 1px dotted transparent;
    }

    /* Win9x-style selection: dithered navy over the icon, navy label */
    .dither { display: none; }
    .icon.selected .dither,
    .icon:focus-visible .dither { display: inline; }
    .icon.selected span,
    .icon:focus-visible span {
      background: var(--select);
      color: var(--select-fg);
      border-color: #ffff00;
    }
    .cv {
      margin-top: 7vh;
      font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
      font-size: 0.95rem;
      color: var(--fg);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>I'm Emil.<br><em>Here's what I work on.</em></h1>

      <symbol id="folder-sel" viewBox="0 0 32 26">
        <path fill="url(#dither)" d="M2 0h10v1h-10zM1 1h12v1h-12zM1 2h12v1h-12zM1 3h30v1h-30zM0 4h32v1h-32zM0 5h32v1h-32zM0 6h32v1h-32zM0 7h32v1h-32zM0 8h32v1h-32zM1 9h30v1h-30zM0 10h32v1h-32zM0 11h32v1h-32zM0 12h32v1h-32zM0 13h32v1h-32zM0 14h32v1h-32zM0 15h32v1h-32zM0 16h32v1h-32zM0 17h32v1h-32zM0 18h32v1h-32zM0 19h32v1h-32zM0 20h32v1h-32zM0 21h32v1h-32zM0 22h32v1h-32zM0 23h32v1h-32zM0 24h32v1h-32zM1 25h30v1h-30z"/>
      </symbol>
    </defs>
  </svg>

  <ul class="desktop">
    <li><a class="icon" href="#speed-skating"><svg viewBox="0 0 32 26"><use href="#folder"/><use class="dither" href="#folder-sel"/></svg><span>Speed Skating</span></a></li>
    <li><a class="icon" href="#research"><svg viewBox="0 0 32 26"><use href="#folder"/><use class="dither" href="#folder-sel"/></svg><span>Research</span></a></li>
    <li><a class="icon" href="#websites"><svg viewBox="0 0 32 26"><use href="#folder"/><use class="dither" href="#folder-sel"/></svg><span>Websites</span></a></li>
    <li><a class="icon" href="#personal"><svg viewBox="0 0 32 26"><use href="#folder"/><use class="dither" href="#folder-sel"/></svg><span>Personal</span></a></li>
  </ul>

  <a class="cv" href="cv.pdf" download>Or, just click here for my CV.</a>

  <script>
    // Click to select, like an old Windows desktop. Click empty space to deselect.
    const icons = document.querySelectorAll('.icon');
    icons.forEach(el => el.addEventListener('click', e => {
      e.preventDefault();
      icons.forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }));
    document.addEventListener('click', e => {
      if (!e.target.closest('.icon')) icons.forEach(i => i.classList.remove('selected'));
    });
  </script>
</body>
</html>
